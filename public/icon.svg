<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#070718"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="f" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- orbit ring -->
  <g filter="url(#f)">
    <ellipse cx="256" cy="276" rx="158" ry="62" fill="none" stroke="url(#neon)"
             stroke-width="6" opacity="0.9" transform="rotate(-18 256 276)"/>
  </g>

  <!-- graduation cap (mortarboard) -->
  <g filter="url(#f)">
    <polygon points="256,142 404,202 256,262 108,202" fill="url(#neon)"/>
    <polygon points="256,160 372,202 256,244 140,202" fill="#070718"/>
    <path d="M180 224 V276 Q256 320 332 276 V224" fill="none"
          stroke="url(#neon)" stroke-width="13" stroke-linecap="round"/>
    <line x1="404" y1="202" x2="404" y2="306" stroke="url(#neon)" stroke-width="5"/>
    <circle cx="404" cy="320" r="13" fill="url(#neon)"/>
  </g>

  <!-- orbit nodes -->
  <circle cx="104" cy="252" r="10" fill="#00e5ff" filter="url(#f)"/>
  <circle cx="412" cy="248" r="7" fill="#ff2d95" filter="url(#f)"/>
</svg>
